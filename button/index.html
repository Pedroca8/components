<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Request Demo Button</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  html, body { height: 100%; background: #000; }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .btn-wrap { perspective: 700px; }
  .btn {
    transform-style: preserve-3d;
    will-change: transform;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 -1px 0 rgba(0,0,0,0.7),
      0 10px 25px rgba(0,0,0,0.55);
  }
  .underline {
    transform: scaleX(0);
    transform-origin: left center;
  }
</style>
</head>
<body class="bg-black h-screen flex items-center justify-center">

  <div class="btn-wrap">
    <button id="btn" class="btn relative rounded-full bg-zinc-900 text-white font-bold text-sm tracking-wide px-7 py-3.5 flex items-center gap-2">
      <span class="relative inline-block">
        REQUEST DEMO
        <span id="underline" class="underline absolute left-0 -bottom-1 h-[2px] w-full bg-white"></span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>

<script>
  const btn = document.getElementById('btn');
  const underline = document.getElementById('underline');

  btn.addEventListener('mouseenter', () => {
    gsap.to(underline, { scaleX: 1, duration: 0.4, ease: 'power3.out' });
  });

  btn.addEventListener('mousemove', (e) => {
    const rect = btn.getBoundingClientRect();
    const relX = e.clientX - rect.left - rect.width / 2;
    const relY = e.clientY - rect.top - rect.height / 2;

    const rotateY = gsap.utils.clamp(-14, 14, (relX / (rect.width / 2)) * 14);
    const rotateX = gsap.utils.clamp(-14, 14, -(relY / (rect.height / 2)) * 14);

    gsap.to(btn, {
      rotationX: rotateX,
      rotationY: rotateY,
      transformPerspective: 500,
      duration: 0.5,
      ease: 'power2.out'
    });
  });

  btn.addEventListener('mouseleave', () => {
    gsap.to(btn, { rotationX: 0, rotationY: 0, duration: 0.6, ease: 'power2.out' });
    gsap.to(underline, { scaleX: 0, duration: 0.3, ease: 'power2.out' });
  });
</script>

</body>
</html>
